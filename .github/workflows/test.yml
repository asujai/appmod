name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    # A hung job must not block for the 6-hour default (a macOS run once did).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # The browser test uses the runner's preinstalled Chrome and is skipped where none exists.
      - run: npm test
      - run: node bin/appmod.mjs validate --all
      - run: node bin/appmod.mjs doctor
