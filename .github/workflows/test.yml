name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The browser test uses the runner's preinstalled Chrome and is skipped where none exists.
      - run: npm test
      - run: node bin/appmod.mjs validate --all
      - run: node bin/appmod.mjs doctor
